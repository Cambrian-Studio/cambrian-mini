name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The sandbox the line uses on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install (there are no runtime dependencies)
        run: npm ci
      # Each step runs as soon as the files it checks exist, so every pull request in the history was checked
      # with what it had; on the finished repository all three always run.
      - name: The committed contract is the one the checksum names
        if: hashFiles('scripts/check-wasm.mjs') != ''
        run: npm run check:wasm -- --require
      - name: Unit tests and attack tests
        if: hashFiles('test/**/*.test.mjs') != ''
        run: npm test
      - name: The judge (no keys; check 16 reads mainnet)
        if: hashFiles('scripts/judge.mjs') != ''
        run: npm run judge
